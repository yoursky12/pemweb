<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pendaftaran</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h2 id="form-title">Form Pendaftaran</h2>
      <span class="sub-header">Pemprograman Aplikasi web</span>
    </div>

    <form action="informasi.html" method="GET">
      <div class="form-group">
        <label for="nama">NAMA</label>
        <input type="text" id="nama" name="nama" placeholder="Nama Lengkap" required>
      </div>

      <div class="form-group">
        <label for="nim">NIM</label>
        <input type="text" id="nim" name="nim" placeholder="ex: 124140000" required>
      </div>

      <div class="form-group">
        <label for="email">EMAIL</label>
        <input type="email" id="email" name="email" placeholder="ex: @student.itera.ac.id" required>
      </div>

      <div class="form-group">
        <label for="password">PASSWORD</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" id="btn-submit">SIMPAN DATA</button>
    </form>
  </div>

</body>
</html>
